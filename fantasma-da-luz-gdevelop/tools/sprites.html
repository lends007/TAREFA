<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Gerador de sprites</title></head>
<body>
<script>
/*
  Gera as imagens do projeto GDevelop reaproveitando o código de desenho
  do "Fantasma da Luz" original (HTML/canvas). Cada quadro é exportado
  como PNG em window.__sprites = { 'arquivo.png': dataURL }.
  Executado por render-sprites.mjs (Playwright).
*/
(() => {
  const W = 384, H = 240;
  const out = {};
  const save = (name, c) => { out[name] = c.toDataURL('image/png'); };

  // aleatório com semente: o cenário sai igual a cada geração
  let seed = 20261014;
  const rand = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rnd = (a, b) => a + rand() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  let ctx = null, clock = 0;
  const frame = (w, h) => { const c = mk(w, h); ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false; return c; };

  function sprite(rows, pal) {
    const h = rows.length, w = rows[0].length;
    const c = mk(w, h), x = c.getContext('2d');
    rows.forEach((r, j) => {
      for (let i = 0; i < w; i++) {
        const col = pal[r[i]];
        if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); }
      }
    });
    return c;
  }

  /* ================= CENÁRIO ================= */
  const bg = mk(W, H), vig = mk(W, H), fog = mk(W * 2, H);
  const tomb = sprite([
    ".lmmmmm.",
    "lmmmmmmm",
    "lmmmddmm",
    "lmddddddm".slice(0, 8),
    "lmmmddmm",
    "lmmmddmm",
    "lmmmmmmm",
    "lmmmmmmm",
    "lmmmmmmm",
    "ssssssss"
  ], { m: '#3a3566', l: '#4b4585', d: '#241f47', s: '#1c1838' });

  (function bake() {
    const b = bg.getContext('2d');
    b.fillStyle = '#14102b'; b.fillRect(0, 0, W, H);
    b.fillStyle = '#181334';
    for (let y = 0; y < H; y += 16)
      for (let x = 0; x < W; x += 16)
        if (((x + y) / 16) % 2 === 0) b.fillRect(x, y, 16, 16);
    b.fillStyle = '#251d4a';
    for (let i = 0; i < 160; i++) b.fillRect(Math.floor(rnd(0, W)), Math.floor(rnd(0, H)), 1, 1);
    b.fillStyle = '#1f1842';
    for (let i = 0; i < 28; i++) {
      const x = Math.floor(rnd(4, W - 12)), y = Math.floor(rnd(4, H - 4));
      b.fillRect(x, y, 5, 1); b.fillRect(x + 4, y + 1, 3, 1); b.fillRect(x + 6, y + 2, 2, 1);
    }
    for (let i = 0; i < 55; i++) {
      const x = Math.floor(rnd(6, W - 6)), y = Math.floor(rnd(6, H - 6));
      b.fillStyle = '#244636';
      b.fillRect(x, y, 1, 3); b.fillRect(x - 1, y + 1, 1, 2); b.fillRect(x + 1, y + 1, 1, 2);
      b.fillStyle = '#3a6a52'; b.fillRect(x, y, 1, 1);
    }
    for (let i = 0; i < 8; i++) {
      const x = Math.floor(rnd(10, W - 10)), y = Math.floor(rnd(10, H - 10));
      b.globalAlpha = 0.10; b.fillStyle = '#6fe8d8';
      b.fillRect(x - 4, y - 2, 9, 5); b.fillRect(x - 2, y - 4, 5, 9);
      b.globalAlpha = 1;
      b.fillStyle = '#d8fff8'; b.fillRect(x, y + 1, 1, 2);
      b.fillStyle = '#6fe8d8'; b.fillRect(x - 1, y, 3, 1); b.fillRect(x - 2, y + 1, 1, 1); b.fillRect(x + 2, y + 1, 1, 1);
    }
    let placed = 0, tries = 0;
    while (placed < 7 && tries++ < 200) {
      const x = Math.floor(rnd(10, W - 18)), y = Math.floor(rnd(12, H - 22));
      if (Math.hypot(x - W / 2, y - H / 2) < 70) continue;
      b.globalAlpha = 0.35; b.fillStyle = '#05030d';
      b.fillRect(x - 1, y + tomb.height - 2, tomb.width + 3, 3);
      b.globalAlpha = 1;
      b.drawImage(tomb, x, y);
      placed++;
    }

    const v = vig.getContext('2d');
    v.fillStyle = 'rgba(5,3,13,0.055)';
    for (let i = 1; i <= 14; i++) {
      const s = i * 3;
      v.fillRect(0, 0, W, s); v.fillRect(0, H - s, W, s);
      v.fillRect(0, s, s, H - 2 * s); v.fillRect(W - s, s, s, H - 2 * s);
    }

    const f = fog.getContext('2d');
    f.fillStyle = 'rgba(138,130,200,0.035)';
    for (let n = 0; n < 16; n++) {
      const cx = rnd(0, W * 2), cy = rnd(20, H - 20), rx = rnd(40, 90), ry = rnd(8, 18);
      for (const off of [0, -W * 2, W * 2])
        for (let dy = -ry; dy <= ry; dy++) {
          const half = rx * Math.sqrt(1 - (dy / ry) ** 2);
          f.fillRect(Math.round(cx + off - half), Math.round(cy + dy), Math.round(half * 2), 1);
        }
    }
  })();
  save('cenario.png', bg);
  save('vinheta.png', vig);
  save('nevoa.png', fog);

  const panel = mk(8, 8), pc = panel.getContext('2d');
  pc.fillStyle = '#05030d'; pc.fillRect(0, 0, 8, 8);
  save('painel.png', panel);

  // texturas brancas das partículas (a cor vem do emissor)
  [1, 2].forEach(n => { const c = mk(n, n), x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, n, n); save('particula_' + n + '.png', c); });

  /* ================= FANTASMA ================= */
  const GW = 38, GH = 40, GOX = 19, GOY = 17;
  const gc = mk(GW, GH), gx = gc.getContext('2d'), gimg = gx.createImageData(GW, GH);
  const GRAMP = [[0.82, '#ffffff'], [0.62, '#e8f4ff'], [0.42, '#cfe3fa'], [0.24, '#a9c6ec'], [-1, '#86a6d8']].map(([k, c]) => [k, hex(c)]);
  const G_EYE = hex('#1a1033'), G_MOUTH = hex('#3a2a66'), G_BLUSH = hex('#ffb3c7'), G_AURA = hex('#a9c9ff');
  const G_EDGE_L = hex('#bcd5f3'), G_EDGE_D = hex('#7a9bd0'), WHITE = hex('#ffffff');

  function gInside(fx, y, tt, mv) {
    if (y < -10.5) return false;
    const hw = y < -2 ? 7.5 * Math.sqrt(Math.max(0, 1 - ((y + 2) / 8.5) ** 2)) : 7.5 + (y + 2) * 0.03;
    const bottom = 8 + 1.8 * Math.sin(fx * 0.85 + tt * 5) + Math.abs(fx) * 0.06;
    if (Math.abs(fx) <= hw && y <= bottom) return true;
    const ax = Math.abs(fx);
    if (ax > 5.5 && ax <= 9.6) {
      const ay = 2.5 + Math.sin(tt * 5 + (fx < 0 ? 0 : 1.5)) * 1.2 - (mv ? 1.5 : 0) + (ax - 6) * 0.35;
      if (Math.abs(y - ay) <= 1.3) return true;
    }
    return false;
  }

  function drawGhost(x, y, tt, lx, ly, mv, bob) {
    const d = gimg.data; d.fill(0);
    const eyeOx = Math.round(lx), eyeY = Math.round(-3 + ly) + 0.5;
    for (let py = 0; py < GH; py++) {
      for (let px = 0; px < GW; px++) {
        const fx = px + 0.5 - GOX, yy = py + 0.5 - GOY;
        const o = (py * GW + px) * 4;
        let rgb = null, a = 255;
        if (gInside(fx, yy, tt, mv)) {
          const s = clamp(0.62 - (fx + yy * 0.7) / 24, 0, 1);
          const edge = !gInside(fx + 1, yy, tt, mv) || !gInside(fx - 1, yy, tt, mv) || !gInside(fx, yy + 1, tt, mv) || !gInside(fx, yy - 1, tt, mv);
          if (edge) rgb = s > 0.5 ? G_EDGE_L : G_EDGE_D;
          else rgb = GRAMP.find(r => s > r[0])[1];
          a = 255 * (1 - 0.5 * clamp((yy - 3) / 8, 0, 1));
          for (const sg of [-1, 1]) {
            const ex = sg * 3 + eyeOx;
            if (Math.abs(fx - ex) <= 1 && Math.abs(yy - eyeY) <= 1) {
              rgb = yy < eyeY - 0.4 && fx < ex ? WHITE : G_EYE; a = 255;
            }
          }
          if (Math.abs(fx) <= 0.6 && ((mv && yy > 2 && yy < 4) || (!mv && yy > 2 && yy < 3))) { rgb = G_MOUTH; a = 255; }
          if (Math.abs(Math.abs(fx) - 5.5) < 0.1 && yy > 0 && yy < 2 && !(edge)) { rgb = G_BLUSH; a = 200; }
        } else {
          const dd = Math.hypot(fx / 9.5, (yy + 1) / 11.5);
          if (dd < 1.36) { rgb = G_AURA; a = dd < 1.18 ? 40 : 20; }
        }
        if (rgb) { d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = a; }
      }
    }
    gx.putImageData(gimg, 0, 0);
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#05030d';
    ctx.fillRect(Math.round(x) - 6, Math.round(y) + 13, 12, 2);
    ctx.globalAlpha = 1;
    ctx.drawImage(gc, Math.round(x) - GOX, Math.round(y) - GOY + bob);
  }

  // 1 ciclo da ondulação (sin(t*5)) dividido em 10 quadros; o balanço vertical acompanha o ciclo
  const G_FRAMES = 10, G_PERIOD = Math.PI * 2 / 5;
  const ghostAnims = [{ name: 'Parado', lx: 0, ly: 0, mv: false }];
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    ghostAnims.push({ name: 'Mover' + i, lx: Math.cos(a), ly: Math.sin(a), mv: true });
  }
  ghostAnims.forEach(an => {
    for (let i = 0; i < G_FRAMES; i++) {
      const c = frame(38, 42);
      const tt = i * G_PERIOD / G_FRAMES;
      drawGhost(19, 18, tt, an.lx, an.ly, an.mv, Math.round(Math.sin(i / G_FRAMES * Math.PI * 2)));
      save('fantasma_' + an.name.toLowerCase() + '_' + i + '.png', c);
    }
  });

  /* ================= BOLA DE FOGO ================= */
  const FW = 44, FH = 44, FOX = 22, FOY = 26;
  const fc = mk(FW, FH), fx_ = fc.getContext('2d'), fimg = fx_.createImageData(FW, FH);
  const FRAMP = [[0.78, '#fff7c2'], [0.58, '#ffd84a'], [0.40, '#ff9a1f'], [0.22, '#e8501a'], [0.06, '#9a1e10']].map(([k, c]) => [k, hex(c)]);
  const F_GLOW = hex('#ff7a1a'), F_EYE = hex('#3b0d06');
  const EYE_CELLS = new Set(['-4,-1', '-3,-1', '-3,0', '-2,0', '3,-1', '2,-1', '2,0', '1,0']);

  function drawFire(f) {
    const d = fimg.data; d.fill(0);
    for (let py = 0; py < FH; py++) {
      for (let px = 0; px < FW; px++) {
        const ix = px - FOX, iy = py - FOY;
        const fx = ix + 0.5, y = iy + 0.5;
        let dx = fx, dy = y;
        if (dy < 0) { dx += f.vxn * (-dy) * 0.3; dy = dy / 1.9; dx *= 1 + (-y) * 0.09; }
        const r = Math.hypot(dx, dy) / 6.4;
        const n = (Math.sin(fx * 1.4 + clock * 11 + f.ph) + Math.sin(y * 1.1 - clock * 14 + fx * 0.6)) * 0.5;
        const amp = 0.1 + (y < 0 ? -y * 0.022 : 0);
        const v = 1 - r + n * amp;
        const o = (py * FW + px) * 4;
        let rgb = null, a = 255;
        if (v > 0.06) {
          if (v > 0.3 && EYE_CELLS.has(ix + ',' + iy)) rgb = F_EYE;
          else rgb = FRAMP.find(k => v > k[0])[1];
          if (v < 0.22) a = 235;
        } else {
          const g = Math.hypot(fx, y * 0.9) / 6.4;
          if (g < 1.7) { rgb = F_GLOW; a = 40; }
          else if (g < 2.6) { rgb = F_GLOW; a = 20; }
        }
        if (rgb) { d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = a; }
      }
    }
    fx_.putImageData(fimg, 0, 0);
    ctx.drawImage(fc, Math.round(f.x) - FOX, Math.round(f.y) - FOY);
  }

  const F_FRAMES = 8;
  [['Centro', 0], ['Esquerda', -0.75], ['Direita', 0.75]].forEach(([name, vxn]) => {
    for (let i = 0; i < F_FRAMES; i++) {
      const c = frame(44, 44);
      clock = i * 0.07;
      drawFire({ x: 22, y: 26, ph: 1, vxn });
      save('fogo_' + name.toLowerCase() + '_' + i + '.png', c);
    }
  });

  /* ================= ESFERA DE LUZ ================= */
  function disc(cx, cy, r, col, al) {
    ctx.globalAlpha = al; ctx.fillStyle = col;
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(r * r + r * 0.5 - dy * dy));
      ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
    }
    ctx.globalAlpha = 1;
  }
  const px1 = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };

  function drawOrb(b) {
    const bob = Math.round(Math.sin(b.age * 2.5 + b.ph) * 2);
    const x = Math.round(b.x), y = Math.round(b.y) + bob;
    const pulse = Math.round(Math.sin(b.age * 5) * 1);
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#ffd84a';
    ctx.fillRect(x - 4, Math.round(b.y) + 10, 8, 1);
    ctx.globalAlpha = 1;
    disc(x, y, 11 + pulse, '#ffd84a', 0.09);
    disc(x, y, 8, '#ffe680', 0.15);
    disc(x, y, 6, '#fff0a0', 0.28);
    disc(x, y, 4, '#f0b52e', 1);
    disc(x - 1, y - 1, 3, '#ffe27a', 1);
    disc(x - 1, y - 1, 2, '#fff6c4', 1);
    px1(x - 2, y - 2, '#ffffff');
    for (let k = 0; k < 3; k++) {
      // as faíscas dão uma volta por ciclo, para a animação fechar em loop
      const a = b.age * 2.5 + k * 2.1;
      px1(x + Math.round(Math.cos(a) * 9), y + Math.round(Math.sin(a) * 6), k === 0 ? '#ffffff' : '#fff6c4');
    }
  }
  const O_FRAMES = 16, O_PERIOD = Math.PI * 2 / 2.5;
  for (let i = 0; i < O_FRAMES; i++) {
    const c = frame(32, 32);
    drawOrb({ x: 16, y: 16, age: i * O_PERIOD / O_FRAMES, ph: 0 });
    save('esfera_' + i + '.png', c);
  }

  /* ================= ESPINHO DE GELO ================= */
  const SPIKE_PARTS = [{ dx: -5, w: 5, h: 9 }, { dx: 0, w: 7, h: 15 }, { dx: 5, w: 5, h: 10 }];
  function drawSpike(s, sparkle) {
    const x = s.x, y = s.y;
    ctx.globalAlpha = 0.13; ctx.fillStyle = '#8fe3ff';
    for (let dy = -3; dy <= 3; dy++) {
      const w = Math.round(15 * Math.sqrt(1 - (dy / 4) ** 2));
      ctx.fillRect(x - w, y + dy + 1, w * 2, 1);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#3a6fa8'; ctx.fillRect(x - 9, y, 18, 1);
    SPIKE_PARTS.forEach(p => {
      for (let r = 0; r < p.h; r++) {
        const ww = Math.max(1, Math.round(p.w * (1 - r / p.h)));
        const x0 = Math.round(x + p.dx - ww / 2);
        ctx.fillStyle = '#6fd0f5'; ctx.fillRect(x0, y - r - 1, ww, 1);
        if (ww > 2) { ctx.fillStyle = '#e4faff'; ctx.fillRect(x0, y - r - 1, 1, 1); }
        if (ww > 3) { ctx.fillStyle = '#3f9cd6'; ctx.fillRect(x0 + ww - 1, y - r - 1, 1, 1); }
      }
    });
    if (sparkle) {
      const ty = y - 17;
      px1(x, ty, '#ffffff'); px1(x - 1, ty, '#d9f7ff'); px1(x + 1, ty, '#d9f7ff'); px1(x, ty - 1, '#d9f7ff'); px1(x, ty + 1, '#d9f7ff');
    }
  }
  [false, true].forEach((sp, i) => {
    const c = frame(32, 24);
    drawSpike({ x: 16, y: 19 }, sp);
    save('espinho_' + i + '.png', c);
  });

  /* ================= AVISO DE FOGO ================= */
  function drawRing(x, y, r, col, rot) {
    ctx.fillStyle = col;
    for (let i = 0; i < 12; i++) {
      const a = rot + i * Math.PI / 6;
      ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r * 0.6), 1, 1);
    }
  }
  const P_FRAMES = 12;
  for (let i = 0; i < P_FRAMES; i++) {
    const c = frame(28, 18);
    const t = 0.9 - i * 0.9 / P_FRAMES;
    clock = i * 0.9 / P_FRAMES;
    const k = 1 - t / 0.9, on = Math.floor(t * 12) % 2 === 0;
    drawRing(14, 9, 4 + k * 8, on ? '#ffd84a' : '#ff7a1a', clock * 4);
    drawRing(14, 9, 2 + k * 4, '#d6361b', -clock * 5);
    ctx.fillStyle = on ? '#ffe680' : '#ff9a1f';
    ctx.fillRect(13, 8, 2, 2);
    save('aviso_' + i + '.png', c);
  }

  /* ================= ÍCONE ================= */
  {
    const c = frame(64, 64);
    ctx.fillStyle = '#14102b'; ctx.fillRect(0, 0, 64, 64);
    const g = mk(38, 42), keep = ctx;
    ctx = g.getContext('2d');
    drawGhost(19, 18, 0.4, 0, 0, false, 0);
    ctx = keep;
    ctx.drawImage(g, 0, 0, 38, 42, 13, 9, 38, 42);
    save('icone.png', c);
  }

  window.__sprites = out;
})();
</script>
</body>
</html>
